<div class="mt-3">
  <div class="setting-item-header">
    <div class="setting-item-label">
      <label
        [class.unselected-setting]="!toggle.checked"
        (click)="toggle.toggle() || valueChanged()"
        class="setting-item clickable">
        {{title}}
      </label>
      @if (tooltip) {
        <button
          #helpTooltip="matTooltip"
          type="button"
          mat-icon-button
          class="help-tooltip-trigger"
          [attr.aria-label]="title"
          [matTooltip]="tooltip"
          [matTooltipClass]="tooltipClass"
          [matTooltipPosition]="tooltipPosition"
          [matTooltipShowDelay]="tooltipShowDelay"
          matTooltipTouchGestures="off"
          (click)="helpTooltip.show(0)"
          (blur)="helpTooltip.hide(0)">
          <mat-icon>info_outline</mat-icon>
        </button>
      }
    </div>
    <mat-slide-toggle #toggle [(ngModel)]="modelValue" class="block"></mat-slide-toggle>
  </div>
  <div [@openClose]="toggle.checked ? 'open' : 'closed'" class="ms-1">
    <ng-content></ng-content>
  </div>
</div>
